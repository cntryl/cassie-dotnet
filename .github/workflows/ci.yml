name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NuGetPackageSourceCredentials_cntryl: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      cassie:
        image: ghcr.io/cntryl/cassie:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 5432:5432
          - 8080:8080
        env:
          CASSIE_PGWIRE_LISTEN: 0.0.0.0:5432
          CASSIE_REST_LISTEN: 0.0.0.0:8080
          CASSIE_ROOT_PASSWORD: cassie-ci
          CASSIE_STORAGE_MODE: memory
          CASSIE_ALLOW_INSECURE_NON_LOOPBACK_LISTEN: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Cassie.slnx

      - name: Check formatting
        run: dotnet format Cassie.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Cassie.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Cassie.slnx --configuration Release --no-build --no-restore

      - name: Wait for Cassie
        run: >-
          curl --fail --silent --show-error --retry 30 --retry-delay 1
          --retry-connrefused --max-time 2 --output /dev/null
          http://127.0.0.1:8080/healthz

      - name: Run live qualification
        env:
          CASSIE_DOTNET_TEST_CONNECTION_STRING: >-
            Host=127.0.0.1;Port=5432;Database=postgres;Username=root;Password=cassie-ci;SSL Mode=Disable;Timeout=15
        run: dotnet run --project test/Cassie.LiveQualification/Cassie.LiveQualification.csproj --configuration Release --no-build
